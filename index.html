<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Propelora AI</title>
<meta name="description" content="Propelora AI - AI-powered property research and deal analysis.">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#eef5ff;
}

button,
input{
  font:inherit;
}

button{
  cursor:pointer;
}

a{
  color:inherit;
  text-decoration:none;
}

/* =========================
   GLOBAL
========================= */

.container{
  width:min(1150px,92%);
  margin:auto;
}

.hidden{
  display:none!important;
}

.blue{
  color:#38a9ff;
}

/* =========================
   NAV
========================= */

nav{
  position:sticky;
  top:0;
  z-index:1000;
  height:70px;
  background:rgba(7,17,31,.95);
  border-bottom:1px solid #1c3149;
  backdrop-filter:blur(12px);
}

.nav-inner{
  height:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:23px;
  font-weight:800;
  letter-spacing:.3px;
}

.logo span{
  color:#38a9ff;
}

.nav-links{
  display:flex;
  align-items:center;
  gap:25px;
}

.nav-links a{
  color:#a9bbcf;
  font-size:14px;
}

.nav-links a:hover{
  color:white;
}

.nav-btn{
  border:0;
  padding:11px 17px;
  border-radius:8px;
  background:#1688e8;
  color:white!important;
  font-weight:700;
}

/* =========================
   HERO
========================= */

.hero{
  padding:95px 0 70px;
  text-align:center;
  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(34,145,235,.2),
      transparent 48%
    );
}

.badge{
  display:inline-block;
  padding:8px 14px;
  border:1px solid #275274;
  border-radius:999px;
  background:#0b1c30;
  color:#69bdff;
  font-size:13px;
  margin-bottom:20px;
}

.hero h1{
  margin:0 auto 22px;
  max-width:950px;
  font-size:clamp(42px,7vw,78px);
  line-height:1;
}

.hero h1 span{
  color:#38a9ff;
}

.hero-text{
  max-width:720px;
  margin:auto;
  color:#9db1c7;
  font-size:18px;
  line-height:1.7;
}

.hero-buttons{
  display:flex;
  justify-content:center;
  gap:13px;
  flex-wrap:wrap;
  margin-top:32px;
}

.btn{
  border:1px solid #28435e;
  border-radius:9px;
  padding:14px 22px;
  color:white;
  background:#0c1b2d;
  font-weight:700;
}

.btn-primary{
  background:#1688e8;
  border-color:#1688e8;
}

.btn-primary:hover{
  background:#0876cf;
}

.btn:hover{
  transform:translateY(-1px);
}

/* =========================
   DASHBOARD PREVIEW
========================= */

.preview{
  margin-top:48px;
  padding:20px;
  text-align:left;
  border:1px solid #223b57;
  border-radius:18px;
  background:#0b1829;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
}

.preview-top{
  display:flex;
  justify-content:space-between;
  margin-bottom:18px;
}

.preview-title{
  font-weight:800;
}

.online{
  color:#55d98b;
  font-size:13px;
}

.search-box{
  border:1px solid #253f5c;
  border-radius:10px;
  padding:14px;
  color:#8298af;
  background:#07111f;
}

.preview-stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
  margin-top:14px;
}

.preview-stat{
  padding:17px;
  border:1px solid #203650;
  border-radius:11px;
  background:#102036;
}

.preview-stat small{
  display:block;
  color:#8195ab;
  margin-bottom:7px;
}

.preview-stat strong{
  font-size:22px;
}

/* =========================
   SECTIONS
========================= */

section{
  padding:80px 0;
}

.heading{
  text-align:center;
  margin-bottom:45px;
}

.heading h2{
  margin:0 0 12px;
  font-size:36px;
}

.heading p{
  max-width:680px;
  margin:auto;
  color:#8fa4ba;
  line-height:1.6;
}

/* =========================
   FEATURES
========================= */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  padding:25px;
  border:1px solid #203650;
  border-radius:15px;
  background:#0b1829;
}

.card-icon{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#102b45;
  color:#4bb3ff;
  font-weight:800;
  margin-bottom:17px;
}

.card h3{
  margin:0 0 10px;
}

.card p{
  margin:0;
  color:#8fa4ba;
  line-height:1.6;
}

/* =========================
   HOW
========================= */

.steps{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.step{
  padding:27px;
  border:1px solid #203650;
  border-radius:15px;
  background:#0b1829;
}

.step-number{
  color:#39a9ff;
  font-weight:800;
  font-size:13px;
  margin-bottom:12px;
}

/* =========================
   PRICING
========================= */

.pricing{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.price-card{
  padding:28px;
  border:1px solid #203650;
  border-radius:15px;
  background:#0b1829;
}

.price-card.featured{
  border-color:#1688e8;
  box-shadow:0 0 0 1px rgba(22,136,232,.18);
}

.plan{
  color:#94a8bd;
  font-size:13px;
  font-weight:700;
}

.price{
  margin:12px 0 7px;
  font-size:42px;
  font-weight:800;
}

.price span{
  font-size:14px;
  color:#8194a9;
  font-weight:normal;
}

.price-card p{
  color:#8fa4ba;
  line-height:1.5;
}

.price-card ul{
  list-style:none;
  padding:0;
  margin:25px 0;
}

.price-card li{
  padding:9px 0;
  border-bottom:1px solid #192d44;
  color:#b2c1d0;
}

/* =========================
   CTA
========================= */

.cta{
  text-align:center;
  border-top:1px solid #1b3048;
  border-bottom:1px solid #1b3048;
  background:#091727;
}

.cta h2{
  margin:0 0 14px;
  font-size:38px;
}

.cta p{
  max-width:650px;
  margin:0 auto 28px;
  color:#91a5bb;
  line-height:1.6;
}

/* =========================
   FOOTER
========================= */

footer{
  padding:35px 0;
  color:#71869d;
  font-size:13px;
}

.footer-inner{
  display:flex;
  justify-content:space-between;
  gap:20px;
  flex-wrap:wrap;
}

.footer-brand{
  color:white;
  font-weight:800;
}

/* =========================
   AUTH OVERLAY
========================= */

.auth-screen{
  position:fixed;
  inset:0;
  z-index:3000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:20px;
  background:rgba(3,9,17,.96);
  overflow:auto;
}

.auth-box{
  width:min(440px,100%);
  padding:32px;
  border:1px solid #24415e;
  border-radius:18px;
  background:#0b1829;
  box-shadow:0 25px 90px rgba(0,0,0,.55);
}

.auth-logo{
  text-align:center;
  font-size:25px;
  font-weight:800;
  margin-bottom:25px;
}

.auth-logo span{
  color:#38a9ff;
}

.auth-box h2{
  margin:0 0 8px;
  text-align:center;
}

.auth-subtitle{
  text-align:center;
  color:#8499b0;
  font-size:14px;
  margin-bottom:25px;
}

.form-group{
  margin-bottom:15px;
}

.form-group label{
  display:block;
  color:#b8c6d5;
  font-size:13px;
  margin-bottom:7px;
}

.form-group input{
  width:100%;
  padding:13px;
  border-radius:8px;
  border:1px solid #29435e;
  outline:none;
  background:#07111f;
  color:white;
}

.form-group input:focus{
  border-color:#238fef;
}

.auth-submit{
  width:100%;
  padding:14px;
  border:0;
  border-radius:9px;
  background:#1688e8;
  color:white;
  font-weight:800;
  margin-top:5px;
}

.auth-submit:hover{
  background:#0876cf;
}

.auth-switch{
  text-align:center;
  margin-top:20px;
  color:#8298ae;
  font-size:14px;
}

.auth-switch button,
.forgot{
  border:0;
  background:none;
  color:#42adff;
  cursor:pointer;
}

.close-auth{
  position:absolute;
  top:20px;
  right:25px;
  border:0;
  background:none;
  color:#a9bbce;
  font-size:25px;
}

   DASHBOARD
========================= */
