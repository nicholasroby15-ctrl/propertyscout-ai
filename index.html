<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Propelora AI</title>

<meta name="description" content="Propelora AI property research and real estate deal analysis dashboard.">

<style>
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#08111f;
  color:#eef4ff;
}

a{
  text-decoration:none;
  color:inherit;
}

.container{
  width:min(1120px,92%);
  margin:auto;
}

/* NAVIGATION */

nav{
  position:sticky;
  top:0;
  z-index:100;
  background:rgba(8,17,31,.94);
  border-bottom:1px solid #1d3049;
  backdrop-filter:blur(10px);
}

.nav-inner{
  height:70px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.logo{
  font-size:22px;
  font-weight:800;
  letter-spacing:.5px;
}

.logo span{
  color:#39a9ff;
}

.nav-links{
  display:flex;
  gap:25px;
  align-items:center;
}

.nav-links a{
  color:#aebdd0;
  font-size:14px;
}

.nav-links a:hover{
  color:white;
}

.nav-button{
  padding:11px 17px;
  background:#1687e8;
  border-radius:8px;
  color:white !important;
  font-weight:700;
}

/* HERO */

.hero{
  padding:95px 0 75px;
  text-align:center;
  background:
    radial-gradient(circle at 50% 0%,rgba(29,139,230,.18),transparent 45%);
}

.badge{
  display:inline-block;
  padding:8px 13px;
  border:1px solid #23496b;
  border-radius:999px;
  background:#0c1b2e;
  color:#69bcff;
  font-size:13px;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(42px,7vw,76px);
  line-height:1;
  margin:0 auto 22px;
  max-width:900px;
}

.hero h1 span{
  color:#39a9ff;
}

.hero p{
  max-width:700px;
  margin:0 auto;
  color:#aebdd0;
  font-size:18px;
  line-height:1.7;
}

.hero-buttons{
  margin-top:32px;
  display:flex;
  justify-content:center;
  gap:14px;
  flex-wrap:wrap;
}

.button{
  display:inline-block;
  padding:14px 22px;
  border-radius:9px;
  font-weight:700;
  border:1px solid #2a4561;
}

.button-primary{
  background:#1687e8;
  border-color:#1687e8;
}

.button-primary:hover{
  background:#0877d3;
}

.button-secondary{
  background:#0d1a2b;
}

.button-secondary:hover{
  background:#13253b;
}

/* DASHBOARD */

.dashboard{
  margin-top:45px;
  background:#0c1829;
  border:1px solid #213650;
  border-radius:18px;
  padding:20px;
  box-shadow:0 25px 80px rgba(0,0,0,.35);
  text-align:left;
}

.dashboard-top{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:center;
  margin-bottom:18px;
}

.dashboard-title{
  font-weight:800;
}

.status{
  color:#58d68d;
  font-size:13px;
}

.search{
  background:#08111f;
  border:1px solid #243c57;
  border-radius:10px;
  padding:14px;
  color:#9db0c6;
  margin-bottom:18px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:12px;
}

.stat{
  padding:17px;
  border-radius:12px;
  background:#101f33;
  border:1px solid #20364f;
}

.stat-label{
  color:#8296ad;
  font-size:12px;
  margin-bottom:8px;
}

.stat-value{
  font-size:22px;
  font-weight:800;
}

/* SECTIONS */

section{
  padding:80px 0;
}

.section-heading{
  text-align:center;
  margin-bottom:45px;
}

.section-heading h2{
  font-size:36px;
  margin:0 0 12px;
}

.section-heading p{
  color:#91a5bc;
  max-width:650px;
  margin:auto;
  line-height:1.6;
}

/* FEATURES */

.features{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
}

.card{
  background:#0c1829;
  border:1px solid #20364f;
  border-radius:15px;
  padding:25px;
}

.icon{
  width:45px;
  height:45px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:10px;
  background:#102a43;
  color:#54b7ff;
  font-size:21px;
  margin-bottom:17px;
}
